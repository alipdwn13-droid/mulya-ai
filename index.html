<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mulya AI</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { display: flex; height: 100vh; height: 100dvh; background-color: #ffffff; color: #1f1f1f; overflow: hidden; }
.sidebar { width: 280px; background-color: #f0f4f9; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid #e3e3e3; }
.main-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; height: 100dvh; position: relative; }
#chat-history { flex: 1; overflow-y: auto; padding: 24px 15%; display: flex; flex-direction: column; gap: 24px; }
.message-row { display: flex; gap: 14px; align-items: flex-start; max-width: 100%; }
.message-row.user { justify-content: flex-end; }
.bubble { padding: 10px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
.message-row.user .bubble { background: #f0f4f9; border-top-right-radius: 4px; }
.message-row.ai .bubble { background: transparent; }
.input-area-wrapper { padding: 15px 15% 25px 15%; }
.input-box { display: flex; flex-direction: column; background: #f0f4f9; border-radius: 24px; padding: 8px 12px; border: 1px solid transparent; }
.input-actions-row { display: flex; align-items: center; width: 100%; gap: 8px; }
textarea { flex: 1; background: transparent; border: none; outline: none; font-size: 15px; resize: none; max-height: 120px; padding: 4px 6px; }
.send-btn, .attach-btn { background: #1f1f1f; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.attach-btn { background: transparent; color: #747775; }
.login-banner { padding: 20px; text-align: center; }
.login-btn { background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 500; }
</style>
</head>
<body>

<div class="sidebar">
    <div>
        <h3>✨ Mulya AI</h3>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">By: Alip Dwi Nugroho</p>
    </div>
</div>

<div class="main-container">
    <div id="login-container" class="login-banner">
        <h3>Silakan Login Google Terlebih Dahulu</h3>
        <br>
        <button class="login-btn" onclick="handleGoogleLogin()">Login dengan Google</button>
    </div>

    <div id="chat-history" style="display: none;"></div>

    <div class="input-area-wrapper" id="inputWrapper" style="display: none;">
        <div class="input-box">
            <div class="input-actions-row">
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <button class="attach-btn" onclick="document.getElementById('imageInput').click()">＋</button>
                <textarea id="userInput" placeholder="Ketik pesan atau tanyakan sesuatu..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
const apiKey = "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";
const googleClientId = "860718785165-1ir3kis2ggepql33ot5m5eo1j8s3k884.apps.googleusercontent.com";
let tokenClient;
let attachedImageBase64 = null;

window.onload = function () {
    if (typeof google !== 'undefined' && google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: googleClientId,
            scope: 'profile email',
            callback: (res) => {
                if (res && res.access_token) {
                    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { 'Authorization': 'Bearer ' + res.access_token }
                    })
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.name) {
                            document.getElementById("login-container").style.display = "none";
                            document.getElementById("chat-history").style.display = "flex";
                            document.getElementById("inputWrapper").style.display = "block";
                        }
                    });
                }
            }
        });
    }
};

function handleGoogleLogin() {
    if (tokenClient) tokenClient.requestAccessToken();
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
        attachedImageBase64 = evt.target.result;
        alert("Gambar berhasil dilampirkan!");
    };
    reader.readAsDataURL(file);
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text && !attachedImageBase64) return;

    const historyDiv = document.getElementById("chat-history");
    historyDiv.innerHTML += `<div class="message-row user"><div class="bubble">${text}</div></div>`;
    input.value = "";
    
    let currentImg = attachedImageBase64;
    attachedImageBase64 = null;

    const aiId = "ai-" + Date.now();
    historyDiv.innerHTML += `<div class="message-row ai" id="${aiId}"><div class="bubble">Sedang berpikir...</div></div>`;
    historyDiv.scrollTop = historyDiv.scrollHeight;

    let messages = [{ role: "user", content: currentImg ? [{ type: "text", text: text || "Analisis gambar ini" }, { type: "image_url", image_url: { url: currentImg } }] : text }];

    fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { 
            "Authorization": "Bearer " + apiKey, 
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "Mulya AI"
        },
        body: JSON.stringify({ 
            model: "google/gemini-flash-1.5", 
            messages: messages 
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.choices && data.choices.length > 0) {
            document.getElementById(aiId).querySelector(".bubble").textContent = data.choices[0].message.content;
        } else {
            document.getElementById(aiId).querySelector(".bubble").textContent = "Error: " + (data.error?.message || "Gagal merespons.");
        }
    })
    .catch(() => {
        document.getElementById(aiId).querySelector(".bubble").textContent = "Kesalahan koneksi jaringan.";
    });
}
</script>
</body>
</html>
